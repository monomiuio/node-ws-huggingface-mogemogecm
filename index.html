<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On This Day in History</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --header-bg: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            --card-bg: #3498db;
            --text-color: #333;
            --shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            --header-bg: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
            --card-bg: #5a67d8;
            --text-color: #e2e8f0;
            --shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Noto Serif', serif; 
            background: var(--bg-gradient); 
            color: var(--text-color); 
            line-height: 1.6; 
            transition: background 0.5s ease; 
        }
        /* Particle background beautification */
        .particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1;
        }
        .particle {
            position: absolute; width: 2px; height: 2px; background: rgba(255,255,255,0.5); border-radius: 50%; animation: float 6s infinite linear;
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }
        
        /* Header */
        header { 
            text-align: center; 
            padding: 2rem; 
            background: var(--header-bg); 
            color: white; 
            position: relative; 
            overflow: hidden; 
        }
        header::before { 
            content: '\f073'; 
            font-family: 'Font Awesome 6 Free'; 
            font-weight: 900; 
            font-size: 4rem; 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%) rotate(15deg); 
            opacity: 0.1; 
            z-index: 0; 
        }
        .header-content { position: relative; z-index: 1; }
        h1 { 
            font-size: 2.5rem; 
            margin-bottom: 0.5rem; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3); 
            animation: fadeInDown 1s ease-out; 
        }
        .date { 
            font-size: 1.2rem; 
            opacity: 0.9; 
            margin-bottom: 1rem; 
        }
        .nav-bar { 
            display: flex; 
            justify-content: center; 
            gap: 2rem; 
            margin-top: 1rem; 
        }
        .nav-link { 
            color: #ecf0f1; 
            text-decoration: none; 
            padding: 0.5rem 1rem; 
            border-radius: 20px; 
            transition: background 0.3s; 
        }
        .nav-link:hover { background: rgba(52, 152, 219, 0.2); }
        .theme-toggle { 
            position: absolute; top: 1rem; right: 1rem; 
            background: none; border: 1px solid #ecf0f1; color: #ecf0f1; 
            padding: 0.5rem; border-radius: 50%; cursor: pointer; transition: all 0.3s; 
        }
        .theme-toggle:hover { background: rgba(52, 152, 219, 0.2); }
        
        /* Search */
        .search-section { padding: 2rem; text-align: center; }
        #searchInput { 
            width: 80%; max-width: 400px; padding: 0.8rem; 
            border: 2px solid #bdc3c7; border-radius: 25px; font-size: 1rem; 
            outline: none; transition: border-color 0.3s; 
        }
        #searchInput:focus { border-color: var(--card-bg); }
        #searchBtn { 
            padding: 0.8rem 1.5rem; background: var(--card-bg); 
            color: white; border: none; border-radius: 25px; 
            margin-left: 1rem; cursor: pointer; transition: background 0.3s; 
        }
        #searchBtn:hover { background: color-mix(in srgb, var(--card-bg), black 20%); }
        
        /* Events grid */
        .events-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 2rem; padding: 2rem; max-width: 1200px; margin: 0 auto; 
        }
        .event-card { 
            background: white; border-radius: 15px; 
            box-shadow: var(--shadow); overflow: hidden; 
            transition: transform 0.3s, box-shadow 0.3s; cursor: pointer; 
            animation: pulse 2s infinite; 
        }
        .event-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 12px 35px rgba(0,0,0,0.15); 
        }
        @keyframes pulse {
            0%, 100% { box-shadow: var(--shadow); }
            50% { box-shadow: 0 0 20px rgba(52, 152, 219, 0.2); }
        }
        .event-header { 
            padding: 1.5rem; background: var(--card-bg); color: white; 
        }
        .event-date { font-weight: bold; font-size: 1.1rem; }
        .event-title { font-size: 1.3rem; margin-top: 0.5rem; }
        .event-details { 
            padding: 1.5rem; display: none; animation: fadeIn 0.5s; 
        }
        .event-details.show { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hidden { display: none; }
        
        /* Footer */
        footer { 
            background: var(--header-bg); color: #ecf0f1; 
            text-align: center; padding: 2rem; margin-top: 3rem; 
        }
        .footer-content { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
        .social-links { display: flex; gap: 1rem; }
        .social-link { color: #ecf0f1; font-size: 1.5rem; transition: color 0.3s; }
        .social-link:hover { color: var(--card-bg); }
        .back-to-top { 
            position: fixed; bottom: 2rem; right: 2rem; 
            background: var(--card-bg); color: white; border: none; 
            border-radius: 50%; width: 50px; height: 50px; cursor: pointer; 
            opacity: 0; transition: opacity 0.3s; 
        }
        .back-to-top.show { opacity: 1; }
        .back-to-top:hover { background: color-mix(in srgb, var(--card-bg), black 20%); }
        
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        
        @media (max-width: 768px) { 
            h1 { font-size: 2rem; } 
            .events-grid { grid-template-columns: 1fr; gap: 1rem; padding: 1rem; } 
            #searchInput { width: 70%; } 
            #searchBtn { margin-left: 0; margin-top: 0.5rem; width: 90%; } 
            .nav-bar { flex-direction: column; gap: 0.5rem; } 
            .back-to-top { bottom: 1rem; right: 1rem; width: 40px; height: 40px; } 
            .theme-toggle { top: 0.5rem; right: 0.5rem; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <header>
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme"><i class="fas fa-moon"></i></button>
        <div class="header-content">
            <h1>On This Day in History</h1>
            <p class="date" id="currentDate"></p>
            <nav class="nav-bar">
                <a href="#eventsGrid" class="nav-link"><i class="fas fa-history"></i> Events</a>
                <a href="#" class="nav-link"><i class="fas fa-info-circle"></i> About</a>
            </nav>
        </div>
    </header>
    
    <section class="search-section">
        <input type="text" id="searchInput" placeholder="Enter keyword to Google search historical events...">
        <button id="searchBtn" onclick="googleSearch()">Search</button>
    </section>
    
    <section class="events-grid" id="eventsGrid">
        <!-- Events loaded by JS automatically -->
    </section>
    
    <footer>
        <div class="footer-content">
            <p>&copy; 2025 On This Day in History. Explore the past, inspire the future.</p>
            <div class="social-links">
                <a href="#" class="social-link"><i class="fab fa-twitter"></i></a>
                <a href="#" class="social-link"><i class="fab fa-weixin"></i></a>
                <a href="#" class="social-link"><i class="fas fa-envelope"></i></a>
            </div>
            <p>Random Reflection: History is a river; today is its source.</p>
        </div>
    </footer>
    
    <button class="back-to-top" onclick="scrollToTop()" id="backToTop">
        <i class="fas fa-arrow-up"></i>
    </button>
    
    <script>
        // Automated: Events data (10 key events on October 26, sourced reliably)
        const eventsData = [
            { date: '1492', title: 'Lead (Graphite) Pencils First Used', details: 'This marks the initial recorded use of pencils, revolutionizing writing and drawing tools globally. How might a simple tool like this have reshaped human creativity?' },
            { date: '1529', title: 'Thomas More Appointed Lord Chancellor of England', details: 'The renowned scholar and statesman takes a key role in Tudor government, highlighting politics and religious tensions. What does his rise reveal about the clash of intellect and power?' },
            { date: '1682', title: 'William Penn Accepts Land Around Delaware River', details: 'This transfer from the Duke of York lays the foundation for Pennsylvania\'s expansion, influencing colonial boundaries and Quaker ideals. How did such land deals shape the American dream?' },
            { date: '1776', title: 'Benjamin Franklin Departs for France', details: 'On a mission to seek French support for the American Revolution, Franklin\'s diplomacy secures a vital alliance. One man\'s journey: How did wit and resolve turn the tide of war?' },
            { date: '1825', title: 'Erie Canal Opens', details: 'Connecting Hudson River to Lake Erie, this engineering marvel boosts U.S. trade and migration. What waves of change did this waterway unleash across a young nation?' },
            { date: '1861', title: 'Pony Express Ends After 19 Months', details: 'The pioneering mail service shuts down with the telegraph\'s rise, symbolizing the West\'s shift to modern tech. In an instant of obsolescence, what lessons on innovation emerge?' },
            { date: '1863', title: 'Football Association Forms in England', details: 'Standardizing soccer and splitting from rugby, this creates rules for the modern global sport. From a meeting room to stadiums worldwide: How did play become passion?' },
            { date: '1881', title: 'Gunfight at the O.K. Corral', details: 'The iconic Wild West shootout pits lawmen like Wyatt Earp against the Cowboys, killing three. Frontier justice in 30 seconds: What myths did this moment forge?' },
            { date: '1918', title: 'Stonehenge Donated to Britain', details: 'Cecil Chubb gifts the prehistoric monument to the nation, preserving it for public study. An act of generosity: How does stewardship breathe life into ancient stones?' },
            { date: '1950', title: 'Mother Teresa Founds Missionaries of Charity', details: 'In Calcutta, this organization begins aiding the poor and sick, modeling global humanitarianism. One calling: How does compassion ripple through time and borders?' }
        ];
        
        // Auto-load date and events
        function initPage() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('currentDate').textContent = now.toLocaleDateString('en-US', options);
            
            const grid = document.getElementById('eventsGrid');
            eventsData.forEach(event => {
                const card = document.createElement('article');
                card.className = 'event-card';
                card.innerHTML = `
                    <div class="event-header">
                        <div class="event-date">${event.date}</div>
                        <div class="event-title">${event.title}</div>
                    </div>
                    <div class="event-details">
                        <p>${event.details}</p>
                    </div>
                `;
                card.onclick = () => toggleDetails(card);
                grid.appendChild(card);
            });
        }
        
        function toggleDetails(card) {
            const details = card.querySelector('.event-details');
            details.classList.toggle('show');
        }
        
        function googleSearch() {
            const input = document.getElementById('searchInput').value;
            if (input) {
                const query = encodeURIComponent('On this day in history ' + input);
                window.open('https://www.google.com/search?q=' + query, '_blank');
            }
        }
        
        // Theme toggle
        function toggleTheme() {
            const body = document.body;
            const icon = document.querySelector('.theme-toggle i');
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                icon.className = 'fas fa-moon';
            } else {
                body.setAttribute('data-theme', 'dark');
                icon.className = 'fas fa-sun';
            }
        }
        
        // Particles
        function createParticles() {
            const particles = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
                particles.appendChild(particle);
            }
        }
        
        // Back to top
        window.onscroll = function() {
            const btn = document.getElementById('backToTop');
            if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
                btn.classList.add('show');
            } else {
                btn.classList.remove('show');
            }
        };
        function scrollToTop() {
            document.body.scrollTop = 0;
            document.documentElement.scrollTop = 0;
        }
        
        // Enter triggers search
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') googleSearch();
        });
        
        // Initialize
        initPage();
        createParticles();
    </script>
</body>
</html>
